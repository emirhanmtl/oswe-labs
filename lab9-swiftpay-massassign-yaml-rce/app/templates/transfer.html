{% extends "base.html" %}
{% block content %}
<h1>Send Money</h1>
<p>Your balance: {{ user.balance }} | Daily limit: {{ user.daily_limit }}</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if success %}<p class="success">{{ success }}</p>{% endif %}
<form method="post">
    <label>Recipient username: <input type="text" name="recipient"></label><br>
    <label>Amount: <input type="text" name="amount"></label><br>
    <label>Note: <input type="text" name="note"></label><br>
    <button type="submit">Send</button>
</form>
{% endblock %}
