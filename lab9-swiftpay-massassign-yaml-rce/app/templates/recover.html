{% extends "base.html" %}
{% block content %}
<h1>Account Recovery</h1>
<p>Enter the email address on your account and the 4-digit security code we texted you
at signup. If they match, we'll sign you straight in.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
    <label>Email: <input type="text" name="email"></label><br>
    <label>Security code: <input type="text" name="security_code" maxlength="4"></label><br>
    <button type="submit">Recover access</button>
</form>
<p><a href="/login">Back to login</a></p>
{% endblock %}
