services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: invoicewise
      POSTGRES_USER: invoicewise
      POSTGRES_PASSWORD: invoicewise_pw
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicewise"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./app
    restart: unless-stopped
    environment:
      DB_CONNECTION: "Host=db;Database=invoicewise;Username=invoicewise;Password=invoicewise_pw"
    ports:
      - "8090:80"
    depends_on:
      db:
        condition: service_healthy
