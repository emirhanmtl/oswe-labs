<!DOCTYPE html>
<html>
<head><title>TemplateMailer - Compose</title></head>
<body>
<h1>Compose campaign email (admin)</h1>
<p><a href="/dashboard">Back</a></p>
<form method="post">
    <label>Body template:</label><br>
    <textarea name="body" rows="8" cols="60">{{ body }}</textarea><br>
    <button type="submit">Preview</button>
</form>
{% if preview is not none %}
<h2>Preview</h2>
<div style="border:1px solid #ccc; padding:10px;">{{ preview }}</div>
{% endif %}
</body>
</html>
