services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: notevault
      MYSQL_USER: notevault
      MYSQL_PASSWORD: notevault_pw
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pw"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./app
    restart: unless-stopped
    environment:
      DB_HOST: db
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
