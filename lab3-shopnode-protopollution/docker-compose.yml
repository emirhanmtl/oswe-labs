services:
  db:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  web:
    build: ./app
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://db:27017/shopnode
    ports:
      - "8083:3000"
    depends_on:
      - db

volumes:
  mongo_data:
